# Navigation Links
#   To link a page section, specify the URL as a hash `/#` followed by the `id` of the section.
#   The `weight` parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /#top
    weight: 10
  - name: Resources
    weight: 40
    hasChildren: true
  - parent: Resources
    name: Member Portal
    url: "https://portal.vancouverlakeview.org"

# Footer links (4-column layout)
#   Top-level items become column headings, children become links.
footer:

  - name: Resources
    weight: 30
  - parent: Resources
    name: Member Portal
    url: "https://portal.vancouverlakeview.org"
    weight: 40

  - name: Legal
    weight: 40
  - parent: Legal
    name: Privacy Policy
    url: /privacy/
    weight: 10
  - parent: Legal
    name: Terms of Service
    url: /terms/
    weight: 20
